name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Build complet avec prérendu : détecte une mise à jour de dépendance
      # incompatible (cf. react-router 8 qui exigeait React 19).
      - name: Build
        run: npm run build
